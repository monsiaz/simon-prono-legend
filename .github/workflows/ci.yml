name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          BOSS_EMAIL: ci@exemple.fr
          BOSS_PASSWORD_HASH_B64: Y2k=
          SESSION_SECRET: ci-secret-factice
